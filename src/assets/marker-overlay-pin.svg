<svg
  xmlns="http://www.w3.org/2000/svg"
  width="64"
  height="64"
  viewBox="0 0 100 100"
  fill="none"
  vector-effect="non-scaling-stroke"
>
  <defs>
    <!-- 底部三角裁切 -->
    <mask id="marker-container-mask-1">
      <polygon points="13,50 88,50 50,100" fill="white" />
      <circle cx="50" cy="50" r="39" fill="black" />
    </mask>
    <!-- 中心挖孔裁切 -->
    <mask id="marker-container-mask-2">
      <polygon points="0,0 100,0 100,100 0,100" fill="white" />
      <circle cx="50" cy="50" r="27" fill="black" />
    </mask>
    <!-- 右下菱形 -->
    <rect
      id="marker-shape-1"
      x="0" y="0" rx="2" width="20" height="20"
      transform="translate(65,65) rotate(-30,10,10) matrix(1, 0, 0.5, 0.866, 0, 0) translate(1) scale(0.75)"
    />
    <!-- 菱形叠加间隙裁切 -->
    <mask id="marker-gap-mask-1">
      <rect x="0" y="0" width="100" height="100" fill="white" />
      <rect
        x="0" y="0" rx="2" width="20" height="20"
        transform="translate(65,65) rotate(-30,10,10) matrix(1, 0, 0.5, 0.866, 0, 0) translate(-1.5,-2.5)"
        fill="black"
      />
    </mask>
  </defs>
  <!-- 原始图标 - 生成时需要注释 -->
  <!-- <g fill="#33333360">
    <rect x="0" y="0" width="100" height="100" fill="#FFF" />
    <circle cx="50" cy="50" r="39" />
    <polygon points="0,50 100,50 100,100 0,100" mask="url(#marker-container-mask-1)" />
    <g fill="#FFF" mask="url(#marker-container-mask-2)">
      <circle cx="50" cy="50" r="39" transform="translate(50,50) scale(0.95) translate(-50,-50)" />
      <polygon points="0,50 100,50 100,100 0,100" mask="url(#marker-container-mask-1)"
        transform="translate(50,40) scale(0.95) translate(-50,-40)" />
    </g>
  </g> -->
  <!-- 附加图层指示图标 -->
  <g>
    <circle cx="75" cy="75" r="16" fill="#333" />
    <!-- <rect x="0" y="0" width="100" height="100" fill="red" mask="url(#marker-gap-mask-1)" /> -->
    <use href="#marker-shape-1" fill="white" />
    <g mask="url(#marker-gap-mask-1)">
      <use href="#marker-shape-1" transform="translate(0,8)" fill="#FFF"  />
    </g>
  </g>
</svg>
